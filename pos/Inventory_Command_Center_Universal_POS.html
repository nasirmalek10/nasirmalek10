 /* Every rule a delivery has to satisfy before it can leave the origin. */
 validateTransferDraft(t){
  const errors=[];
  if(!t.fromLocationId)errors.push('Choose an origin location.');
  if(!t.toLocationId)errors.push('Choose a destination location.');
  if(t.fromLocationId&&t.fromLocationId===t.toLocationId)errors.push('Origin and destination must be different locations.');
  const lines=this.transferLines(t);
  if(!lines.length)errors.push('Add at least one product with a quantity above zero.');
  const seen=new Set();
  for(const l of lines){
   const p=this.productById(l.productId);
   if(!p){errors.push('A line refers to a product that no longer exists.');continue;}
   if(seen.has(l.productId))errors.push(`${p.productName} appears on more than one line — combine them into a single line.`);
   seen.add(l.productId);
   const qty=num(l.qty);
   if(!Number.isInteger(qty)||qty<=0)errors.push(`${p.productName}: enter a whole quantity above zero.`);
   const onHand=this.qtyAt(l.productId,t.fromLocationId);
   if(qty>onHand&&!this.state.settings.allowNegative)errors.push(`${p.productName}: ${fmt(qty)} requested but only ${fmt(onHand)} on hand at ${this.locationName(t.fromLocationId)}.`);
  }
  return [...new Set(errors)];
 }
 /* Transfer legs never change what the business owns, only where it sits, so the movement row
    carries an unchanged before/after and records the units and both endpoints explicitly. */
 recordTransferMovement(product,type,units,fromLocationId,toLocationId,transfer){
  const actor=this.currentUser();
  this.state.movements.unshift({id:uid('mov'),date:iso(),productId:product.id,sku:product.sku,before:num(product.quantity),change:0,after:num(product.quantity),type,
   locationId:toLocationId,fromLocationId,toLocationId,units:num(units),reason:transfer.notes||'Stock transfer',
   reference:`${transfer.number} · ${this.locationName(fromLocationId)} → ${this.locationName(toLocationId)}`,
   purchaseOrderId:'',transferId:transfer.id,userId:actor?.id||'',userName:actor?.name||'',
   notes:`${fmt(units)} unit(s) ${type==='Transfer Out'?'dispatched':type==='Transfer In'?'received':'adjusted'} on ${transfer.number}`});
 }
 async dispatchTransfer(id,detail={}){
  this.assertCan('transfers.dispatch','Dispatching a transfer');
  const t=this.transferById(id);if(!t)throw new Error('Transfer could not be found.');
  if(t.status!=='Draft')throw new Error(`Only a draft can be dispatched. ${t.number} is already ${t.status}.`);
  const errors=this.validateTransferDraft(t);if(errors.length)throw new Error(errors.join(' '));
  const actor=this.currentUser();
  await this.atomicState(()=>{
   for(const l of this.transferLines(t)){
    const p=this.productById(l.productId);
    /* Origin → in-transit. The product total is untouched, so units stay visible and valued
       while belonging to neither warehouse. */
    this.applyStockDeltaAtLocation(p.id,t.fromLocationId,-num(l.qty));
    this.applyStockDeltaAtLocation(p.id,TRANSIT_LOCATION_ID,num(l.qty));
    this.pruneStockRows(p.id);this.syncProductQuantity(p);p.updatedAt=iso();
    this.recordTransferMovement(p,'Transfer Out',num(l.qty),t.fromLocationId,t.toLocationId,t);
   }
   t.status='In Transit';t.dispatchedAt=iso();
   if(detail.releasedBy!==undefined)t.releasedBy=detail.releasedBy||actor?.name||'';
   if(detail.carrier!==undefined)t.carrier=detail.carrier;
   if(detail.vehicle!==undefined)t.vehicle=detail.vehicle;
   this.commitTransferHighWater(t.number);
  });
  return t;
 }
 async receiveTransfer(id,quantities,detail={}){
  this.assertCan('transfers.receive','Receiving a transfer');
  const t=this.transferById(id);if(!t)throw new Error('Transfer could not be found.');
  if(t.status!=='In Transit')throw new Error(`Only a dispatched transfer can be received. ${t.number} is ${t.status}.`);
  const lines=this.transferLines(t),applied=[];
  for(const l of lines){
   const raw=quantities[l.id];if(raw===undefined||raw===null||raw==='')continue;
   const qty=Math.floor(Number(raw)),outstanding=num(l.qty)-num(l.receivedQty)-num(l.varianceQty);
   const p=this.productById(l.productId);
   if(!Number.isFinite(qty)||qty<0)throw new Error(`Enter a whole received quantity of zero or more for ${p?.productName||l.productName}.`);
   if(qty>outstanding)throw new Error(`${p?.productName||l.productName}: ${fmt(qty)} entered but only ${fmt(outstanding)} unit(s) are still in transit.`);
   if(qty>0)applied.push({line:l,product:p,qty});
  }
  const writeOff=Boolean(detail.closeWithVariance);
  if(!applied.length&&!writeOff)throw new Error('Enter at least one received quantity, or close the transfer with a recorded variance.');
  const actor=this.currentUser();
  await this.atomicState(()=>{
   for(const a of applied){
    if(!a.product)throw new Error(`${a.line.productName} no longer exists in the catalogue.`);
    this.applyStockDeltaAtLocation(a.product.id,TRANSIT_LOCATION_ID,-a.qty);
    this.applyStockDeltaAtLocation(a.product.id,t.toLocationId,a.qty);
    this.pruneStockRows(a.product.id);this.syncProductQuantity(a.product);a.product.updatedAt=iso();
    a.line.receivedQty=num(a.line.receivedQty)+a.qty;
    this.recordTransferMovement(a.product,'Transfer In',a.qty,t.fromLocationId,t.toLocationId,t);
   }
   const outstanding=this.transferOutstanding(t);
   if(outstanding>0&&writeOff){
    /* A shortfall is a real loss: the units leave in-transit and leave the business, recorded
       against the destination so the variance is investigable. */
    for(const l of lines){
     const short=num(l.qty)-num(l.receivedQty)-num(l.varianceQty);if(short<=0)continue;
     const p=this.productById(l.productId);if(!p)continue;
     this.applyStockDeltaAtLocation(p.id,TRANSIT_LOCATION_ID,-short);
     this.pruneStockRows(p.id);this.syncProductQuantity(p);p.updatedAt=iso();
     l.varianceQty=num(l.varianceQty)+short;
     this.state.movements.unshift({id:uid('mov'),date:iso(),productId:p.id,sku:p.sku,before:num(p.quantity)+short,change:-short,after:num(p.quantity),type:'Transfer Variance',
      locationId:t.toLocationId,fromLocationId:t.fromLocationId,toLocationId:t.toLocationId,units:short,
      reason:detail.varianceReason||'Short delivery closed with variance',reference:`${t.number} variance`,
      purchaseOrderId:'',transferId:t.id,userId:actor?.id||'',userName:actor?.name||'',
      notes:`${fmt(short)} unit(s) dispatched but never received`});
    }
   }
   const stillOut=this.transferOutstanding(t);
   if(stillOut<=0)t.status=lines.some(l=>num(l.varianceQty)>0)?'Received with Variance':'Received';
   if(t.status!=='In Transit'){t.receivedAt=iso();t.receivedBy=detail.receivedBy||t.receivedBy||actor?.name||'';}
   else if(detail.receivedBy)t.receivedBy=detail.receivedBy;
   if(detail.varianceReason)t.varianceReason=detail.varianceReason;
  });
  return t;
 }
 async cancelTransfer(id,reason){
  this.assertCan('transfers.create','Cancelling a transfer');
  const t=this.transferById(id);if(!t)throw new Error('Transfer could not be found.');
  if(!this.transferIsOpen(t))throw new Error(`${t.number} is ${t.status} and can no longer be cancelled.`);
  const actor=this.currentUser();
  await this.atomicState(()=>{
   if(t.status==='In Transit'){
    /* Everything still in transit goes back where it came from. */
    for(const l of this.transferLines(t)){
     const outstanding=num(l.qty)-num(l.receivedQty);if(outstanding<=0)continue;
     const p=this.productById(l.productId);if(!p)throw new Error(`${l.productName} no longer exists, so ${t.number} cannot be reversed cleanly.`);
     this.applyStockDeltaAtLocation(p.id,TRANSIT_LOCATION_ID,-outstanding);
     this.applyStockDeltaAtLocation(p.id,t.fromLocationId,outstanding);
     this.pruneStockRows(p.id);this.syncProductQuantity(p);p.updatedAt=iso();
     this.recordTransferMovement(p,'Transfer Cancelled',outstanding,TRANSIT_LOCATION_ID,t.fromLocationId,t);
    }
   }
   t.status='Cancelled';t.cancelledAt=iso();t.cancelReason=reason||'';
   t.cancelledBy=actor?.name||'';
  });
  return t;
 }

 /* ---- Transfer dialogs ----------------------------------------------------------------- */
 locationOptionsHTML(selected){return this.state.locations.map(l=>`<option value="${l.id}" ${l.id===selected?'selected':''}>${esc(l.name)}</option>`).join('');}
 transferSourceOptions(fromLocationId,excludeIds=[]){
  return this.activeProducts()
   .filter(p=>!excludeIds.includes(p.id)&&this.qtyAt(p.id,fromLocationId)>0)
   .sort((a,b)=>String(a.productName).localeCompare(String(b.productName)))
   .map(p=>`<option value="${p.id}">${esc(p.productName)} · ${esc(p.sku)} — ${fmt(this.qtyAt(p.id,fromLocationId))} on hand</option>`).join('');
 }
 openTransfer(id=''){
  this.assertCan('transfers.create','Creating a transfer');
  if(this.state.locations.length<2)throw new Error('Create at least two locations before transferring stock.');
  const existing=id?this.transferById(id):null;
  if(existing&&existing.status!=='Draft')return this.viewTransfer(id);
  const me=this.currentUser();
  this.workingTransfer=existing?clone(existing):{
   id:uid('trf'),number:this.nextTransferNumber(),status:'Draft',createdAt:iso(),date:day(),
   fromLocationId:this.state.locations[0].id,toLocationId:this.state.locations[1].id,lines:[],
   preparedBy:me?.name||this.state.settings.cashierName||'',releasedBy:'',receivedBy:'',
   carrier:'',vehicle:'',notes:'',dispatchedAt:'',receivedAt:'',userId:me?.id||'',userName:me?.name||''
  };
  this.modal(existing?`Edit ${existing.number}`:'New transfer',this.transferEditorHTML(),
   `<button class="button ghost" data-modal-cancel>Cancel</button><button class="button secondary" id="saveTransferDraft">Save draft</button>${this.can('transfers.dispatch')?'<button class="button primary" id="dispatchTransferNow">Save and dispatch</button>':''}`,'Transfers');
  this.bindTransferEditor();
 }
 transferEditorHTML(){
  const t=this.workingTransfer,used=t.lines.map(l=>l.productId),options=this.transferSourceOptions(t.fromLocationId,used);
  const errors=this.validateTransferDraft(t);
  const lineRows=t.lines.map(l=>{
   const onHand=this.qtyAt(l.productId,t.fromLocationId),over=num(l.qty)>onHand;
   return `<tr><td>${esc(l.productName)}<small class="cell-sub">${esc(l.sku)}</small></td><td>${fmt(onHand)}</td><td><input data-line-qty="${l.id}" type="number" min="1" step="1" max="${onHand}" value="${esc(l.qty)}" style="width:110px" class="${over?'invalid':''}"></td><td>${money(num(l.qty)*num(l.unitCost),this.state.settings.currency)}</td><td class="row-actions"><button type="button" class="button danger small" data-line-remove="${l.id}">Remove</button></td></tr>`;
  }).join('');
  return `<form id="transferForm" onsubmit="return false">
   <div class="form-grid">
    <label class="field"><span>Delivery receipt number</span><input name="number" value="${esc(t.number)}"></label>
    <label class="field"><span>Date</span><input name="date" type="date" value="${esc(t.date)}"></label>
    <label class="field"><span>From location</span><select name="fromLocationId">${this.locationOptionsHTML(t.fromLocationId)}</select></label>
    <label class="field"><span>To location</span><select name="toLocationId">${this.locationOptionsHTML(t.toLocationId)}</select></label>
    <label class="field"><span>Prepared by</span><input name="preparedBy" value="${esc(t.preparedBy||'')}"></label>
    <label class="field"><span>Carrier / driver</span><input name="carrier" value="${esc(t.carrier||'')}"></label>
    <label class="field"><span>Vehicle / plate</span><input name="vehicle" value="${esc(t.vehicle||'')}"></label>
    <label class="field"><span>Notes</span><input name="notes" value="${esc(t.notes||'')}"></label>
   </div>
   <h3 style="margin:18px 0 8px;font-size:14px">Items to send</h3>
   ${t.lines.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>At origin</th><th>Send</th><th>Value</th><th></th></tr></thead><tbody>${lineRows}</tbody></table></div>`:'<p style="color:var(--muted);margin:0 0 10px">No items yet. Choose a product below and add it — you can send any quantity, not the whole SKU.</p>'}
   <div class="header-actions" style="justify-content:flex-start;margin-top:12px;align-items:flex-end">
    <label class="field header-field grow" style="--header-field-min:320px"><span>Add product from ${esc(this.locationName(t.fromLocationId))}</span><select id="transferAddProduct">${options||'<option value="">No stock available at this location</option>'}</select></label>
    <label class="field" style="margin:0;width:130px"><span>Quantity</span><input id="transferAddQty" type="number" min="1" step="1" value="1"></label>
    <button type="button" class="button secondary" id="transferAddLine" ${options?'':'disabled'}>Add item</button>
   </div>
   ${errors.length?`<div class="notice warning" style="margin-top:14px">${errors.map(esc).join('<br>')}</div>`:`<div class="notice success" style="margin-top:14px">Ready to dispatch: ${fmt(this.transferUnits(t))} unit(s) across ${fmt(this.transferLines(t).length)} line(s), worth ${money(this.transferValue(t),this.state.settings.currency)}.</div>`}
   <div class="notice" style="margin-top:10px">Dispatching moves the units out of the origin into an <strong>In Transit</strong> holding bucket. They stay in your total stock and valuation but belong to neither location until the destination confirms receipt.</div>
  </form>`;
 }
 syncTransferEditor(){
  const form=$('#transferForm');if(!form||!this.workingTransfer)return;
  const t=this.workingTransfer,o=this.formObject(form);
  t.number=String(o.number||t.number).trim();t.date=o.date||t.date;
  t.fromLocationId=o.fromLocationId;t.toLocationId=o.toLocationId;
  t.preparedBy=o.preparedBy||'';t.carrier=o.carrier||'';t.vehicle=o.vehicle||'';t.notes=o.notes||'';
  for(const input of $$('[data-line-qty]',form)){
   const line=t.lines.find(l=>l.id===input.dataset.lineQty);
   if(line)line.qty=Math.max(0,Math.floor(Number(input.value)||0));
  }
 }
 redrawTransferEditor(){$('#modalBody').innerHTML=this.transferEditorHTML();this.bindTransferEditor();}
 bindTransferEditor(){
  const t=this.workingTransfer;
  $('[data-modal-cancel]').onclick=()=>{this.workingTransfer=null;this.closeModal();};
  const form=$('#transferForm');
  for(const name of ['fromLocationId','toLocationId'])form.elements[name].onchange=()=>{
   this.syncTransferEditor();
   /* Changing the origin invalidates every line, because availability is per location. */
   if(name==='fromLocationId')t.lines=[];
   this.redrawTransferEditor();
  };
  for(const input of $$('[data-line-qty]',form))input.oninput=()=>this.syncTransferEditor();
  for(const button of $$('[data-line-remove]',form))button.onclick=()=>{this.syncTransferEditor();t.lines=t.lines.filter(l=>l.id!==button.dataset.lineRemove);this.redrawTransferEditor();};
  const add=$('#transferAddLine');
  if(add)add.onclick=()=>{
   this.syncTransferEditor();
   const productId=$('#transferAddProduct').value,qty=Math.max(1,Math.floor(Number($('#transferAddQty').value)||1));
   const p=this.productById(productId);if(!p)return this.toast('Choose a product to add.','warning');
   const onHand=this.qtyAt(productId,t.fromLocationId);
   t.lines.push({id:uid('trfline'),productId:p.id,sku:p.sku,productName:p.productName,qty:Math.min(qty,onHand||qty),receivedQty:0,varianceQty:0,unitCost:num(p.cost)});
   this.redrawTransferEditor();
  };
  const saveDraft=$('#saveTransferDraft');
  if(saveDraft)saveDraft.onclick=()=>this.runAction(saveDraft,()=>this.persistTransferDraft(false));
  const dispatch=$('#dispatchTransferNow');
  if(dispatch)dispatch.onclick=()=>this.runAction(dispatch,()=>this.persistTransferDraft(true));
 }
 async persistTransferDraft(thenDispatch){
  this.syncTransferEditor();
  const t=this.workingTransfer;if(!t)throw new Error('No transfer is being edited.');
  t.lines=t.lines.filter(l=>num(l.qty)>0);
  const duplicate=this.state.transfers.find(x=>x.id!==t.id&&slug(x.number)===slug(t.number));
  if(duplicate)throw new Error(`Delivery receipt number ${t.number} is already used by another transfer.`);
  if(!String(t.number||'').trim())throw new Error('Enter a delivery receipt number.');
  const errors=this.validateTransferDraft(t);
  if(errors.length&&thenDispatch)throw new Error(errors.join(' '));
  if(!t.lines.length)throw new Error('Add at least one item before saving.');
  await this.atomicState(()=>{
   const index=this.state.transfers.findIndex(x=>x.id===t.id);
   if(index>=0)this.state.transfers[index]=clone(t);else this.state.transfers.unshift(clone(t));
   this.commitTransferHighWater(t.number);
  });
  const saved=this.transferById(t.id);
  this.workingTransfer=null;
  if(thenDispatch){
   await this.dispatchTransfer(saved.id,{releasedBy:saved.preparedBy,carrier:saved.carrier,vehicle:saved.vehicle});
   this.closeModal();this.toast(`${saved.number} dispatched. ${fmt(this.transferUnits(saved))} unit(s) are now in transit.`);
   this.navigate('transfers');
   return this.showDeliveryReceipt(saved.id);
  }
  this.closeModal();this.toast(`${saved.number} saved as a draft.`);this.navigate('transfers');
 }
 viewTransfer(id){
  const t=this.transferById(id);if(!t)throw new Error('Transfer could not be found.');
  const lines=this.transferLines(t);
  const body=`<div class="stat-list">
    <div class="stat-row"><span>Status</span><strong><span class="badge ${this.transferStatusClass(t.status)}">${esc(t.status)}</span></strong></div>
    <div class="stat-row"><span>Route</span><strong>${esc(this.locationName(t.fromLocationId))} → ${esc(this.locationName(t.toLocationId))}</strong></div>
    <div class="stat-row"><span>Prepared by</span><strong>${esc(t.preparedBy||'—')}</strong></div>
    <div class="stat-row"><span>Dispatched</span><strong>${t.dispatchedAt?new Date(t.dispatchedAt).toLocaleString():'Not yet'}${t.releasedBy?` · ${esc(t.releasedBy)}`:''}</strong></div>
    <div class="stat-row"><span>Received</span><strong>${t.receivedAt?new Date(t.receivedAt).toLocaleString():'Not yet'}${t.receivedBy?` · ${esc(t.receivedBy)}`:''}</strong></div>
    ${t.carrier||t.vehicle?`<div class="stat-row"><span>Carrier</span><strong>${esc([t.carrier,t.vehicle].filter(Boolean).join(' · '))}</strong></div>`:''}
    ${t.cancelReason?`<div class="stat-row"><span>Cancelled because</span><strong>${esc(t.cancelReason)}</strong></div>`:''}
   </div>
   <div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Product</th><th>Sent</th><th>Received</th><th>Variance</th><th>Value</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${esc(l.productName)}<small class="cell-sub">${esc(l.sku)}</small></td><td>${fmt(l.qty)}</td><td>${fmt(l.receivedQty||0)}</td><td>${num(l.varianceQty)?`<span class="badge danger">−${fmt(l.varianceQty)}</span>`:'—'}</td><td>${money(num(l.qty)*num(l.unitCost),this.state.settings.currency)}</td></tr>`).join('')}</tbody></table></div>
   ${t.notes?`<div class="notice" style="margin-top:12px">${esc(t.notes)}</div>`:''}`;
  const actions=[`<button class="button ghost" data-modal-close>Close</button>`,`<button class="button secondary" id="transferPrint">Delivery receipt</button>`];
  if(t.status==='Draft'&&this.can('transfers.create'))actions.push(`<button class="button ghost" id="transferEdit">Edit</button>`);
  if(this.transferIsOpen(t)&&this.can('transfers.create'))actions.push(`<button class="button danger" id="transferCancel">Cancel transfer</button>`);
  if(t.status==='Draft'&&this.can('transfers.dispatch'))actions.push(`<button class="button primary" id="transferDispatch">Dispatch</button>`);
  if(t.status==='In Transit'&&this.can('transfers.receive'))actions.push(`<button class="button primary" id="transferReceive">Receive</button>`);
  this.modal(t.number,body,actions.join(''),'Transfers');
  $('[data-modal-close]').onclick=()=>this.closeModal();
  $('#transferPrint').onclick=()=>this.showDeliveryReceipt(t.id);
  const edit=$('#transferEdit');if(edit)edit.onclick=()=>this.openTransfer(t.id);
  const dispatch=$('#transferDispatch');
  if(dispatch)dispatch.onclick=()=>this.runAction(dispatch,async()=>{await this.dispatchTransfer(t.id,{releasedBy:t.preparedBy});this.closeModal();this.toast(`${t.number} dispatched.`);this.navigate('transfers');this.showDeliveryReceipt(t.id);});
  const receive=$('#transferReceive');if(receive)receive.onclick=()=>this.openReceiveTransfer(t.id);
  const cancel=$('#transferCancel');
  if(cancel)cancel.onclick=()=>{
   this.modal(`Cancel ${t.number}`,`<form id="cancelTransferForm"><p>${t.status==='In Transit'?`Everything still in transit returns to <strong>${esc(this.locationName(t.fromLocationId))}</strong> and a reversing movement is recorded.`:'This draft has not moved any stock, so nothing is reversed.'}</p>${this.field('Reason','reason','')}</form>`,`<button class="button ghost" data-modal-cancel>Keep it</button><button class="button danger" id="confirmCancelTransfer">Cancel transfer</button>`,'Transfers');
   $('[data-modal-cancel]').onclick=()=>this.viewTransfer(t.id);
   const button=$('#confirmCancelTransfer');
   button.onclick=()=>this.runAction(button,async()=>{await this.cancelTransfer(t.id,this.formObject($('#cancelTransferForm')).reason);this.closeModal();this.toast(`${t.number} cancelled.`);this.navigate('transfers');});
  };
 }
 openReceiveTransfer(id){
  const t=this.transferById(id);if(!t)throw new Error('Transfer could not be found.');
  if(t.status!=='In Transit')throw new Error(`${t.number} is ${t.status} and cannot be received.`);
  const lines=this.transferLines(t).filter(l=>num(l.qty)-num(l.receivedQty)-num(l.varianceQty)>0);
  this.modal(`Receive ${t.number}`,`<form id="receiveTransferForm"><p style="margin:0 0 12px;color:var(--muted)">Arriving at <strong>${esc(this.locationName(t.toLocationId))}</strong> from ${esc(this.locationName(t.fromLocationId))}. Count the goods and enter what actually arrived — short deliveries are allowed.</p>
   <div class="table-wrap"><table><thead><tr><th>Product</th><th>Sent</th><th>Already received</th><th>Receiving now</th></tr></thead><tbody>${lines.map(l=>{const outstanding=num(l.qty)-num(l.receivedQty)-num(l.varianceQty);return `<tr><td>${esc(l.productName)}<small class="cell-sub">${esc(l.sku)}</small></td><td>${fmt(l.qty)}</td><td>${fmt(l.receivedQty||0)}</td><td><input name="recv_${l.id}" type="number" min="0" step="1" max="${outstanding}" value="${outstanding}" style="width:110px"></td></tr>`;}).join('')}</tbody></table></div>
   <div class="form-grid" style="margin-top:14px">${this.field('Received by','receivedBy',this.currentUser()?.name||'')}${this.field('Variance reason (if short)','varianceReason','')}</div>
   <label class="field checkbox"><input name="closeWithVariance" type="checkbox"><span>Close this delivery even if short, and write the missing units off as a recorded loss</span></label>
   <div class="notice warning">Leave the box unticked to receive a partial delivery and keep the remainder in transit. Tick it only when the missing units are confirmed lost — they are removed from stock and a <strong>Transfer Variance</strong> movement is written for investigation.</div></form>`,
   `<button class="button ghost" data-modal-cancel>Cancel</button><button class="button primary" id="confirmReceiveTransfer">Confirm receipt</button>`,'Transfers');
  $('[data-modal-cancel]').onclick=()=>this.viewTransfer(t.id);
  const button=$('#confirmReceiveTransfer');
  button.onclick=()=>this.runAction(button,async()=>{
   const form=$('#receiveTransferForm'),fd=new FormData(form),quantities={};
   for(const l of lines)quantities[l.id]=fd.get(`recv_${l.id}`);
   const updated=await this.receiveTransfer(t.id,quantities,{receivedBy:String(fd.get('receivedBy')||''),varianceReason:String(fd.get('varianceReason')||''),closeWithVariance:fd.get('closeWithVariance')==='on'});

 /* Per-location totals now come from the stock ledger, so a SKU split across sites is counted
    at each site it actually occupies rather than only at its nominal storage location. */
 locationTotals(locationId){
  const rows=this.stockByLocation(locationId);let units=0,cost=0,retail=0,risks=0;
  for(const r of rows){
   const p=this.productById(r.productId);if(!p||!this.isOperational(p))continue;
   const qty=num(r.qty),held=Math.max(0,qty);
   units+=qty;cost+=held*num(p.cost);retail+=held*num(p.price);
   if(qty<=0||qty<=num(p.reorderPoint))risks++;
  }
  return {products:rows.filter(r=>this.isOperational(this.productById(r.productId))).length,units,cost,retail,risks};
 }

   `<div class="panel-grid">${ls.map(l=>{const t=this.locationTotals(l.id);return `<section class="panel"><header class="panel-header"><div><h2>${esc(l.name)}</h2><p>${esc(l.type||'Storage location')} · ${esc(l.address||'No address')}</p></div>${canEdit?`<button class="icon-button" data-action="edit-location" data-id="${l.id}">✎</button>`:''}</header><div class="panel-body"><div class="stat-list"><div class="stat-row"><span>Products held</span><strong>${fmt(t.products)}</strong></div><div class="stat-row"><span>Units on hand</span><strong>${fmt(t.units)}</strong></div><div class="stat-row"><span>Cost value</span><strong>${money(t.cost,currency)}</strong></div><div class="stat-row"><span>Retail value</span><strong>${money(t.retail,currency)}</strong></div><div class="stat-row"><span>Tax profile</span><strong>${configuredNumber(l.taxRate)?`${esc(l.taxLabel||'Tax')} ${num(l.taxRate).toFixed(3).replace(/\.?0+$/,'')}%`:'Product/default fallback'}</strong></div><div class="stat-row"><span>Jurisdiction</span><strong>${esc([l.countryCode?countryName(l.countryCode):'',l.region||'',l.postalCode||''].filter(Boolean).join(' · ')||'Not configured')}</strong></div><div class="stat-row"><span>At or below reorder point</span><strong>${fmt(t.risks)}</strong></div></div></div></section>`}).join('')}</div>
   ${ls.length?`<section class="panel"><header class="panel-header"><div><h2>Stock on hand by location</h2><p>Exactly what sits at one location, drawn from the movement ledger.</p></div><label class="field header-field" style="--header-field-min:230px"><span>Location</span><select id="locationStockPicker">${ls.map(l=>`<option value="${l.id}" ${l.id===selected?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label></header>

 advisories(products=null){
  const dismissed=new Set(this.state.advisoryHistory.filter(h=>['dismissed','completed'].includes(h.status)).map(h=>h.key));
  const snoozed=new Map(this.state.advisoryHistory.filter(h=>h.status==='snoozed').map(h=>[h.key,h.until]));
  const out=[];
  for(const p of (products||this.operationalEnriched())){/* QA3 fix (H1): advisories act on operational stock only. */
   const add=(type,severity,title,explanation,action,impact,confidence,deadline)=>{
    const key=`${type}:${p.id}`;if(dismissed.has(key))return;const until=snoozed.get(key);if(until&&new Date(until)>new Date())return;
    out.push({key,type,severity,title,productIds:[p.id],explanation,action,impact,confidence,deadline,evidence:[
     `Available: ${fmt(p.available)}`,`Average daily usage: ${p.avgDaily.toFixed(2)}`,`Lead time: ${fmt(p.leadTime||this.state.settings.defaultLeadTime)} days`,`Suggested order: ${fmt(p.suggested)}`
    ]});
   };
   if(['Out of Stock','Reorder Now'].includes(p.status))add('stockout','critical',`${p.productName} needs immediate action`,p.avgDaily?`At the recent usage rate, available stock does not cover the supplier lead time.`:`Available stock is at or below the reorder threshold; demand history is limited.`,`Review and approve ${p.suggested} units for purchase.`,p.suggested*num(p.cost),p.avgDaily?0.94:0.72,day(new Date(Date.now()+2*86400000)));
   else if(p.status==='Reorder Soon')add('reorder','high',`Reorder ${p.productName} soon`,`Projected inventory is at or below its effective reorder point.`,`Order ${p.suggested} units, rounded to MOQ/case pack.`,p.suggested*num(p.cost),0.88,day(new Date(Date.now()+5*86400000)));
   if(p.status==='Overstocked')add('overstock','medium',`${p.productName} is overstocked`,`Available stock exceeds the configured maximum-stock threshold.`,`Pause replenishment and consider a promotion or transfer.`,Math.max(0,p.available-num(p.maxStock))*num(p.cost),0.9,day(new Date(Date.now()+14*86400000)));
   if(p.status==='Dead Stock')add('deadstock','medium',`${p.productName} has no recent movement`,`No qualifying movement was detected within the dead-stock period.`,`Review for liquidation, bundling, return, or write-down.`,p.inventoryCost,0.86,day(new Date(Date.now()+14*86400000)));
   if(p.expirationDate&&daysBetween(day(),p.expirationDate)>=0&&daysBetween(day(),p.expirationDate)<=45)add('expiration','high',`${p.productName} is approaching expiration`,`The recorded expiration date is within 45 days.`,`Prioritize sale or usage, transfer stock, and verify lot details.`,p.inventoryCost,0.96,p.expirationDate);
   if(!p.supplierId||!p.sku||!num(p.leadTime))add('quality','medium',`${p.productName} has incomplete reorder data`,`Missing supplier, SKU, or lead-time data lowers recommendation confidence.`,`Complete the missing product fields.`,0,0.99,day(new Date(Date.now()+7*86400000)));
   if(num(p.price)>0&&p.margin<.2)add('margin','medium',`${p.productName} has a low gross margin`,`Current unit cost and selling price imply a margin below 20%.`,`Review pricing or negotiate supplier cost.`,p.available*Math.max(0,num(p.price)*.2-(num(p.price)-num(p.cost))),0.98,day(new Date(Date.now()+30*86400000)));
  }
  return out.sort((a,b)=>({critical:0,high:1,medium:2,low:3}[a.severity]-({critical:0,high:1,medium:2,low:3}[b.severity])));
 }

 validateWorkbookPackage(definition,report){
  if(report.sheetCount!==definition.sheets.length)throw new Error(`XLSX verification failed: expected ${definition.sheets.length} sheets, found ${report.sheetCount}.`);
  const actualByName=new Map(),names=new Set();
  for(const sheet of report.sheets||[]){if(names.has(sheet.name))throw new Error(`XLSX verification failed: duplicate sheet ${sheet.name}.`);names.add(sheet.name);actualByName.set(sheet.name,sheet);}
  for(const expected of definition.sheets){const actual=actualByName.get(expected.name);if(!actual)throw new Error(`XLSX verification failed: missing ${expected.name}.`);if(actual.rowCount!==expected.rows.length)throw new Error(`XLSX verification failed: ${expected.name} row count changed (${actual.rowCount} vs ${expected.rows.length}).`);}
  const catalog=actualByName.get('Product Catalog'),summary=actualByName.get('Inventory Summary'),movements=actualByName.get('Stock Movements'),sales=actualByName.get('Sales and Usage');
  if((catalog?.rowCount||0)!==this.state.products.length+1)throw new Error('XLSX verification failed: Product Catalog is incomplete.');
  if((movements?.rowCount||0)!==this.state.movements.length+1)throw new Error('XLSX verification failed: Stock Movements is incomplete.');
  if((sales?.rowCount||0)!==this.state.sales.length+1)throw new Error('XLSX verification failed: Sales and Usage is incomplete.');
  const opCount=this.activeProducts().length;if(opCount&&(summary?.formulaCount||0)<opCount*2)throw new Error(`XLSX verification failed: expected at least ${opCount*2} live inventory formulas, found ${summary?.formulaCount||0}.`);
  return true;
 }
 validateWorkbookExport(definition,parsed){
  if(parsed.sheets.length!==definition.sheets.length)throw new Error(`XLSX verification failed: expected ${definition.sheets.length} sheets, found ${parsed.sheets.length}.`);
  const names=new Set();for(const expected of definition.sheets){const actual=parsed.sheets.find(s=>s.name===expected.name);if(!actual)throw new Error(`XLSX verification failed: missing ${expected.name}.`);if(names.has(actual.name))throw new Error(`XLSX verification failed: duplicate sheet ${actual.name}.`);names.add(actual.name);if(actual.rows.length!==expected.rows.length)throw new Error(`XLSX verification failed: ${expected.name} row count changed.`);}
  const catalog=parsed.sheets.find(s=>s.name==='Product Catalog'),summary=parsed.sheets.find(s=>s.name==='Inventory Summary'),movements=parsed.sheets.find(s=>s.name==='Stock Movements'),sales=parsed.sheets.find(s=>s.name==='Sales and Usage');

 /* QA fix (critical): CSV exports now use a customer-safe schema. The signed XLSX
    workbook needs internal ID columns for exact restoration, but ordinary CSVs are
    meant for humans and for tabular re-import — so technical ID columns are excluded,
    the machine-only Workspace Metadata sheet is not exported, and Tax Rate is written
    in percent (8.6), matching what the tabular importer stores. This makes the app's
    own CSVs re-importable without corruption. */
 csvDatasets(){
  const wb=this.workbookDefinition();
  const TECHNICAL=new Set(['Product ID','Supplier ID','Location ID','PO ID','Line ID','Movement ID','Sale ID','Count ID','Transaction ID','Transaction Line ID','Session ID','Return ID','Transfer ID','User ID']);
  return wb.sheets.filter(s=>!['Executive Dashboard','Workspace Metadata'].includes(s.name)).map(s=>{
   const plain=s.rows.map(r=>r.map(v=>v&&typeof v==='object'?(v.value??''):v));
   const headers=(plain[0]||[]).map(String);
   const keep=headers.map(h=>!TECHNICAL.has(h));
   const taxIndex=s.name==='Product Catalog'?headers.indexOf('Tax Rate'):-1;
   const rows=plain.map((r,ri)=>{
    const row=r.slice();
    if(taxIndex>=0&&ri>0&&row[taxIndex]!==''&&row[taxIndex]!=null)row[taxIndex]=+(num(row[taxIndex])*100).toFixed(4);
    return row.filter((_,i)=>keep[i]!==false);
   });
   return {name:s.name,rows};
  });
 }

  await asyncTest('Package verifier validates export without full parse',async()=>{const wb=this.workbookDefinition(),blob=await XLSXLite.build(wb,{type:'blob'}),report=await XLSXLite.validatePackage(await blob.arrayBuffer());this.validateWorkbookPackage(wb,report);const summary=report.sheets.find(s=>s.name==='Inventory Summary');assert(summary&&summary.formulaCount===this.activeProducts().length*2,'Formula count evidence differs');return `${report.sheetCount} sheets validated from package XML without rebuilding workbook rows`;});

  await asyncTest('Workbook round-trip preserves IDs, workflow, and nested records',async()=>{
   this.state.suppliers.push({id:'qa_dupA',name:'QA Dup Supplier',contact:'Casey',email:'qa@example.com',phone:'555-0101',address:'1 QA Way',website:'https://supplier.example',paymentTerms:'Net 30',currency:'USD',leadTime:4,minimumOrderValue:125,minimumOrderQty:6,shippingMethod:'Ground',rating:5,active:true,notes:'Critical supplier note',createdAt:'2025-01-02T03:04:05.000Z',updatedAt:'2026-02-03T04:05:06.000Z'},{id:'qa_dupB',name:'QA Dup Supplier',leadTime:9,active:true,createdAt:iso()});
   this.state.locations.push({id:'qa_locA',name:'QA Dup Loc',type:'Warehouse',address:'Phoenix',notes:'Primary QA location',active:true,createdAt:'2025-03-04T05:06:07.000Z',updatedAt:'2026-04-05T06:07:08.000Z'},{id:'qa_locB',name:'QA Dup Loc',type:'Store',active:true});
   this.state.products.push(
    {id:'qa_rt1',productName:'RT One',sku:'QRT-1',quantity:2,reserved:0,incoming:0,cost:1,price:2,supplierId:'qa_dupA',locationId:'qa_locA',reviewPeriod:21,reorderWorkflow:'On Hold',productStatus:'Active',casePack:1,leadTime:4,createdAt:'2026-01-02T03:04:05.000Z',updatedAt:'2026-06-07T08:09:10.000Z'},
    {id:'qa_rt2',productName:'RT Two',sku:'QRT-2',quantity:3,reserved:0,incoming:0,cost:1,price:2,supplierId:'qa_dupB',locationId:'qa_locB',reviewPeriod:14,reorderWorkflow:'Ordered',productStatus:'Active',casePack:1,leadTime:9,createdAt:'2026-02-03T04:05:06.000Z',updatedAt:'2026-05-06T07:08:09.000Z'});
   this.state.counts.push({id:'qa_rtc',number:'COUNT-QA-RT',date:day(),type:'Count by Location',status:'Completed',locationId:'qa_locA',locationName:'QA Dup Loc',variance:1,notes:'',lines:[{productId:'qa_rt1',locationId:'qa_locA',systemQty:1,countedQty:2,variance:1}]});
   this.state.advisoryHistory.push({id:'qa_rtadv',key:'stockout:qa_rt1',status:'dismissed',date:iso(),until:null});
   try{
    const wb=this.workbookDefinition(),blob=await XLSXLite.build(wb,{type:'blob'}),parsed=await XLSXLite.parse(await blob.arrayBuffer());
    const cls=this.classifyWorkbook(parsed);
    assert(cls.kind==='roundtrip-v2','Workspace workbook was not classified correctly');

    assert(r1.reviewPeriod===21&&r2.reviewPeriod===14,'Review periods were replaced by defaults');
    assert(r1.reorderWorkflow==='On Hold'&&r2.reorderWorkflow==='Ordered','Reorder workflow lost in round trip');
    assert(r1.createdAt==='2026-01-02T03:04:05.000Z'&&r1.updatedAt==='2026-06-07T08:09:10.000Z','Product timestamps truncated in round trip');

    assert(rl?.notes==='Primary QA location'&&rl?.createdAt==='2025-03-04T05:06:07.000Z'&&rl?.updatedAt==='2026-04-05T06:07:08.000Z','Location fields or timestamps lost in round trip');
    const rc=payload.counts.find(c=>c.number==='COUNT-QA-RT');
    assert(rc&&rc.lines.length===1&&rc.lines[0].countedQty===2,'Inventory count lines lost in round trip');assert(rc.locationId==='qa_locA'&&rc.lines[0].locationId==='qa_locA','Inventory count location IDs lost in round trip');
    assert(payload.advisoryHistory.some(a=>a.key==='stockout:qa_rt1'),'Advisory history lost in round trip');
    return 'Duplicate-name relationships plus product, supplier, and location fields all preserved';
   }finally{

   }
