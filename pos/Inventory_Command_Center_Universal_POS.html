  <style>
:root {

}

  --primary: #54766f; --primary-strong: #405e58; --primary-soft: #e3eeeb; --blue: #61788f; --blue-soft: #e7edf3;
  --amber: #9a7131; --amber-soft: #f7ebd0; --coral: #a8675d; --coral-soft: #f4dfdc; --green: #5e8068; --green-soft: #e4eee6;
}
[data-theme="dark"] {
  --bg: #0d1724; --surface: #142235; --surface-2: #182a40; --text: #ecf3fb; --muted: #a4b3c5; --line: #2a3e54;
  --nav: #09111c; --nav-2: #142235; --primary: #2bb8b2; --primary-strong: #46cbc5; --primary-soft: #163c41;
  --blue: #73a5ff; --blue-soft: #203b66; --amber: #e8aa49; --amber-soft: #493719; --coral: #ff8276; --coral-soft: #512824;
  --green: #62d3a6; --green-soft: #183e32; --purple: #b590ff; --purple-soft: #342653; --shadow: 0 14px 36px rgba(0,0,0,.24);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px; }
.hidden { display: none !important; }
.mobile-only { display: none !important; }

/* QA10 fix (M4): 100vh on a phone resolves to the LARGE viewport — the height with the browser
   toolbars collapsed. Combined with body{overflow:hidden} the bottom of the shell sat behind the
   URL bar with no way to scroll it into view, which is how the sidebar footer (Sign out) gets
   lost on mobile. 100dvh tracks the visible viewport; the 100vh line stays first as a fallback
   for engines without dvh. */
.app-shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0,1fr); height: 100vh; height: 100dvh; }
/* QA fix (blocker): the sidebar is a fixed-height column that must never grow past the
   viewport. body{overflow:hidden} propagates to the viewport, so anything pushed below the
   fold was unreachable — on a 1920x1080 screen that hid the sidebar footer, and with it the
   only Sign out control in the app. `overflow:hidden` here plus `min-height:0` on .nav-list
   lets the nav list's own `overflow:auto` engage instead of inflating its parent. */
.sidebar { background: linear-gradient(165deg, var(--nav), color-mix(in srgb, var(--nav) 80%, #000)); color: #eff7ff; display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 22px 14px 16px; box-shadow: 8px 0 28px rgba(10,30,48,.14); z-index: 10; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 20px; }
.brand-mark { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg,#27c9bd,#2786e6); font-weight: 900; box-shadow: 0 9px 22px rgba(26,173,185,.25); }
.brand strong, .brand span { display: block; }
.brand strong { font-size: 18px; letter-spacing: -.02em; }
.brand span { opacity: .68; font-size: 12px; margin-top: 2px; }
/* min-height:0 is what makes the overflow:auto above it real: without it a flex item refuses
   to shrink below its content height, so the list never scrolled and the sidebar grew instead. */
.nav-list { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow: auto; padding: 0 4px 8px; scrollbar-width: thin; }
.sidebar-footer { flex: 0 0 auto; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 11px; border: 0; background: transparent; color: rgba(239,247,255,.72); border-radius: 11px; padding: 9px 11px; text-align: left; cursor: pointer; transition: background .18s ease, color .18s ease, transform .18s ease; font-size: 13px; }
.nav-item:hover { background: rgba(255,255,255,.08); color: #fff; transform: translateX(2px); }
.nav-item.active { background: linear-gradient(100deg, rgba(42,199,187,.26), rgba(73,133,236,.18)); color: #fff; box-shadow: inset 3px 0 #47ded3; }
.nav-icon { width: 22px; text-align: center; opacity: .94; font-size: 16px; }
.sidebar-footer { margin-top: auto; padding: 12px 4px 0; border-top: 1px solid rgba(255,255,255,.1); }
.sidebar .button.ghost { border-color: rgba(255,255,255,.22); color: #fff; background: rgba(255,255,255,.06); }
.storage-status { margin-top: 12px; font-size: 11px; opacity: .74; display: flex; gap: 8px; align-items: center; padding: 0 4px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f1b84b; box-shadow: 0 0 0 4px rgba(241,184,75,.12); }
.status-dot.ready { background: #45d29d; box-shadow: 0 0 0 4px rgba(69,210,157,.12); }

.workspace { min-width: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.topbar { height: 72px; flex: 0 0 72px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: color-mix(in srgb, var(--surface) 92%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); z-index: 5; }
.breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.breadcrumbs span { color: var(--muted); }
.global-search { margin-left: auto; min-width: 310px; max-width: 480px; flex: 1; height: 42px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 0 11px; }
.global-search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--text); }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; background: var(--surface); color: var(--muted); border-radius: 6px; padding: 2px 6px; font-size: 10px; }
.top-actions { display: flex; gap: 9px; }
.main-content { flex: 1; overflow: auto; padding: 24px; scroll-behavior: smooth; }

.button { border: 1px solid transparent; border-radius: 10px; min-height: 40px; padding: 8px 14px; font-weight: 750; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
.button:hover:not(:disabled) { transform: translateY(-1px); }
.button:disabled { opacity: .45; cursor: not-allowed; }
.button.primary { color: #fff; background: linear-gradient(135deg,var(--primary),var(--blue)); box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 22%, transparent); }
.button.secondary { color: var(--primary); background: var(--primary-soft); border-color: color-mix(in srgb,var(--primary) 22%,transparent); }
.button.ghost { color: var(--text); background: transparent; border-color: var(--line); }
.button.danger { color: var(--coral); background: var(--coral-soft); }
.button.small { min-height: 32px; padding: 5px 10px; font-size: 12px; }
.button.full { width: 100%; }
.icon-button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; display: grid; place-items: center; cursor: pointer; font-size: 18px; }

.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
.page-header h1 { margin: 4px 0 5px; font-size: clamp(24px,3vw,34px); letter-spacing: -.04em; }
.page-header p { margin: 0; color: var(--muted); max-width: 760px; line-height: 1.55; }
.eyebrow { margin: 0; text-transform: uppercase; letter-spacing: .13em; font-weight: 850; font-size: 10px; color: var(--primary); }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.metric-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; margin-bottom: 18px; }
.metric-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 17px; box-shadow: var(--shadow); position: relative; overflow: hidden; cursor: pointer; min-height: 132px; }
.metric-card::after { content:""; position:absolute; right:-28px; top:-24px; width:90px; height:90px; border-radius:50%; background: var(--metric-soft,var(--primary-soft)); opacity:.8; }
.metric-card:hover { border-color: color-mix(in srgb,var(--metric,var(--primary)) 35%,var(--line)); }
.metric-label { color: var(--muted); font-size: 12px; font-weight: 700; }
.metric-value { font-size: 29px; letter-spacing: -.045em; font-weight: 900; margin: 15px 0 6px; }
.metric-note { font-size: 11px; color: var(--muted); }
.metric-accent { }
.metric-card.metric-accent::before { content:""; position:absolute; left:17px; bottom:14px; width:34px; height:5px; border-radius:10px; background:var(--metric,var(--primary)); }

.panel-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; margin-bottom: 16px; }
.panel-grid.equal { grid-template-columns: repeat(2,minmax(0,1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.panel-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 17px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-header h2, .panel-header h3 { margin: 0; font-size: 16px; }
.panel-header p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
.panel-body { padding: 18px; }
.panel-body.flush { padding: 0; }

.chart-bars { display:flex; flex-direction:column; gap:12px; min-height:220px; padding-top:8px; }
.chart-bar-wrap { min-width:0; text-align:left; }
.chart-bar { display:block; height:9px; min-width:4px; background:linear-gradient(90deg,var(--primary),var(--blue)); border-radius:999px; transition:width .4s ease; position:relative; }
.chart-label { display:flex; justify-content:space-between; gap:12px; margin-bottom:5px; color:var(--muted); font-size:11px; overflow:hidden; white-space:nowrap; }
.chart-label span { overflow:hidden; text-overflow:ellipsis; }
.chart-label strong { color:var(--text); flex:none; }
.donut-wrap { display: grid; grid-template-columns: 180px 1fr; align-items: center; gap: 22px; }
.donut { width: 170px; aspect-ratio:1; border-radius:50%; background: conic-gradient(var(--green) 0 var(--a), var(--amber) var(--a) var(--b), var(--coral) var(--b) var(--c), var(--purple) var(--c)); position:relative; }
.donut::after { content:""; position:absolute; inset:27px; background:var(--surface); border-radius:50%; box-shadow: inset 0 0 0 1px var(--line); }
.donut-center { position:absolute; inset:0; z-index:1; display:grid; place-content:center; text-align:center; font-weight:900; font-size:25px; }
.donut-center span { display:block; font-size:10px; color:var(--muted); font-weight:700; margin-top:2px; }
.legend { display:flex; flex-direction:column; gap:10px; }
.legend-row { display:grid; grid-template-columns:10px 1fr auto; gap:9px; align-items:center; font-size:12px; }
.legend-dot { width:10px; height:10px; border-radius:3px; }

.table-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:13px 15px; border-bottom:1px solid var(--line); background:var(--surface-2); }
.table-toolbar input, .table-toolbar select { height:36px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--text); padding:0 10px; }
.table-toolbar .spacer { margin-left:auto; }
.pagination-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 15px; border-top:1px solid var(--line); background:var(--surface-2); }
.pagination-bar .pagination-info { color:var(--muted); font-size:11px; font-weight:700; }
.pagination-bar .pagination-actions { display:flex; align-items:center; gap:8px; }
.pagination-bar .pagination-page { min-width:92px; text-align:center; font-size:11px; font-weight:850; }
/* QA10 fix (M3, blocker): this cap was unconditional, and the 260px subtrahend assumes desktop
   chrome. On a landscape handset (375px tall) it resolved to 115px against 61px rows — a header
   plus one visible row, with the whole record set hidden behind a 115px scroller. The max() floor
   guarantees the table always keeps a usable window no matter how short the viewport is. */
.table-wrap { overflow:auto; max-height: max(340px, calc(100dvh - 260px)); }
table { border-collapse:separate; border-spacing:0; width:100%; font-size:12px; }
th { position:sticky; top:0; z-index:2; background:var(--surface-2); color:var(--muted); text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
th, td { padding:11px 13px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
tbody tr:hover { background:color-mix(in srgb,var(--primary-soft) 45%,transparent); }
/* QA10 fix (D1): min-width is here for the wide data tables, where it stops the product column
   collapsing. It was also being inherited by the POS product card, which is only ~179px wide at
   1280px, so every card overflowed by 45px and clipped the SKU/barcode line. Scoped to tables;
   the POS card overrides it back to 0 and ellipsises instead. */
.product-cell { display:flex; align-items:center; gap:9px; min-width:0; }
table .product-cell { min-width:210px; }
.product-avatar { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-weight:900; color:#fff; background:linear-gradient(135deg,var(--primary),var(--blue)); }
.cell-sub { display:block; color:var(--muted); font-size:10px; margin-top:2px; }
.row-actions { display:flex; gap:5px; }
.link-button { border:0; background:transparent; color:var(--blue); cursor:pointer; padding:2px; font-weight:750; }
/* QA9 fix: `.checkbox` was applied to the whole `<label class="field checkbox">`, so the
   16px sizing clamped the entire row to a 16px box (its text spilled out and overlapped the
   section below) while `.field input` styled the checkbox itself into a full-width 42px box.
   Scope the small size to the checkbox INPUT and lay the label out as an inline row. */
.field.checkbox { flex-direction:row; align-items:center; gap:9px; }
.field.checkbox input[type=checkbox] { width:16px; height:16px; min-height:0; flex:0 0 auto; padding:0; border:0; border-radius:0; background:none; accent-color:var(--primary); }
.field.checkbox span { font-size:13px; color:var(--text); }

.badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:5px 8px; font-size:10px; font-weight:850; border:1px solid transparent; }
.badge.healthy, .badge.received, .badge.active { background:var(--green-soft); color:var(--green); border-color:color-mix(in srgb,var(--green) 18%,transparent); }
.badge.watch, .badge.reorder-soon, .badge.partial { background:var(--amber-soft); color:var(--amber); }
.badge.reorder-now, .badge.out-of-stock, .badge.overdue, .badge.cancelled { background:var(--coral-soft); color:var(--coral); }
.badge.overstocked, .badge.dead-stock, .badge.on-hold { background:var(--purple-soft); color:var(--purple); }
.badge.data-incomplete, .badge.draft { background:var(--surface-2); color:var(--muted); border-color:var(--line); }
.badge.ordered, .badge.sent, .badge.approved { background:var(--blue-soft); color:var(--blue); }
/* QA fix: statuses rendered by statusClass() previously had no matching CSS rule
   (.badge.partial never matched the actual class "partially-received"). */
.badge.partially-received { background:var(--amber-soft); color:var(--amber); }
.badge.awaiting-approval { background:var(--blue-soft); color:var(--blue); }
.badge.discontinued { background:var(--surface-2); color:var(--muted); border-color:var(--line); }
/* QA fix: exception-aware purchase-order statuses. */
.badge.received-with-exceptions { background:var(--amber-soft); color:var(--amber); }
.badge.exception-open { background:var(--coral-soft); color:var(--coral); }

.empty-state { padding:42px 20px; text-align:center; color:var(--muted); }
.empty-icon { width:64px; height:64px; border-radius:20px; display:grid; place-items:center; margin:0 auto 12px; background:var(--primary-soft); font-size:26px; }
.empty-state h3 { color:var(--text); margin:0 0 7px; }
.empty-state p { margin:0 auto 16px; max-width:460px; line-height:1.5; }

.kanban { display:grid; grid-template-columns:repeat(7,minmax(250px,1fr)); gap:12px; overflow:auto; padding:4px 2px 18px; min-height:520px; }
.kanban-column { background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:11px; min-height:490px; }
.kanban-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12px; font-weight:850; }
.kanban-count { background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px 7px; font-size:10px; }
.kanban-list { min-height:420px; display:flex; flex-direction:column; gap:9px; }
.kanban-pager { display:flex; align-items:center; justify-content:space-between; gap:7px; padding-top:10px; margin-top:10px; border-top:1px solid var(--line); }
.kanban-pager span { color:var(--muted); font-size:9px; font-weight:800; text-align:center; white-space:nowrap; }
.kanban-pager .button { min-width:34px; padding-inline:8px; }
.kanban-list.drag-over { outline:2px dashed var(--primary); outline-offset:4px; border-radius:12px; }
.kanban-card { background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:12px; box-shadow:0 7px 18px rgba(31,55,78,.08); cursor:grab; }
.kanban-card:active { cursor:grabbing; }
.kanban-card.dragging { opacity:.48; transform:rotate(1deg); }
.kanban-card h4 { margin:0 0 3px; font-size:13px; }
.kanban-meta { color:var(--muted); font-size:10px; }
.kanban-stats { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:11px 0; }
.kanban-stat { background:var(--surface-2); border-radius:8px; padding:7px; }
.kanban-stat span, .kanban-stat small { display:block; color:var(--muted); font-size:9px; }
.kanban-stat strong { font-size:12px; }
.card-footer { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.risk-meter { height:5px; flex:1; border-radius:10px; background:var(--line); overflow:hidden; }
.risk-meter span { display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--coral)); }

.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.form-grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field.full { grid-column:1/-1; }
.field label { font-size:11px; font-weight:800; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:10px; min-height:42px; padding:9px 10px; }
.field textarea { min-height:90px; resize:vertical; }
.field-hint { color:var(--muted); font-size:10px; line-height:1.4; }
/* QA fix (P3, responsive): selects mounted inside a panel/section header used to carry hard-coded
   inline min-widths (230px Locations picker, 210px Transfers filter, 320px transfer product
   picker). Below 760px `.main-content` sets overflow-x:hidden, so at 320px the overshoot was
   clipped rather than scrollable. The control now keeps its comfortable desktop minimum but is
   allowed to collapse onto its own full-width row once the header can no longer hold it.
   NOTE: must stay AFTER `.field`, which sets min-width:0 at the same specificity and would
   otherwise win on source order and silently drop the desktop minimum. */
.header-field { margin:0; flex:0 1 auto; min-width:var(--header-field-min,210px); }
.header-field.grow { flex:1 1 var(--header-field-min,210px); }
.validation-error { color:var(--coral); font-size:10px; font-weight:750; }

.modal-backdrop { position:fixed; inset:0; z-index:100; background:rgba(8,20,33,.54); backdrop-filter:blur(4px); display:grid; place-items:center; padding:20px; }
/* QA10 fix (P3): 96vw ignored the backdrop's own 20px-per-side padding, so at 375px the dialog
   resolved to 360px inside 335px of room and overhung the viewport by 2px. 100% respects the
   padding box. max-height switched to dvh for the same reason as the app shell. */
.modal { width:min(880px,100%); max-height:92dvh; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:0 30px 90px rgba(0,0,0,.3); animation:modalIn .2s ease-out; }
.modal-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:19px 21px; border-bottom:1px solid var(--line); }
.modal-header h2 { margin:4px 0 0; font-size:22px; }
.modal-body { padding:21px; overflow:auto; }
/* QA10 fix (P4): the checkout form is a plain block, so the totals list and the payment fields
   both sat at y=302 with a 0px gap — "Total due" visually collided with "Payment method" on the
   highest-stakes dialog in the app. Grid + gap spaces every modal form consistently. */
.modal-body > form { display:grid; gap:18px; }
.modal-footer { padding:14px 21px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:9px; background:var(--surface-2); border-radius:0 0 22px 22px; }
@keyframes modalIn { from { opacity:0; transform:translateY(10px) scale(.985); } }

.toast-region { position:fixed; right:20px; bottom:20px; z-index:200; display:flex; flex-direction:column; gap:9px; width:min(390px,calc(100vw - 40px)); pointer-events:none; }
.toast { pointer-events:auto; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--primary); color:var(--text); border-radius:13px; box-shadow:0 14px 40px rgba(12,32,50,.22); padding:13px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:10px; animation:toastIn .22s ease-out; }
.toast.success { border-left-color:var(--green); }
.toast.error { border-left-color:var(--coral); }
.toast.warning { border-left-color:var(--amber); }
.toast-content { min-width:0; }
.toast strong { display:block; font-size:12px; }
.toast p { margin:3px 0 0; font-size:11px; color:var(--muted); line-height:1.45; white-space:normal; overflow-wrap:anywhere; }
.toast button { border:0; background:transparent; cursor:pointer; color:var(--muted); padding:0 2px; font-size:17px; line-height:1; }
@keyframes toastIn { from { opacity:0; transform:translateY(10px); } }

.drop-zone { border:2px dashed color-mix(in srgb,var(--primary) 35%,var(--line)); border-radius:18px; background:linear-gradient(145deg,var(--primary-soft),var(--surface)); padding:34px 20px; text-align:center; transition:.18s ease; }
.drop-zone.drag-over { border-color:var(--primary); transform:scale(1.005); }
.drop-zone h3 { margin:10px 0 6px; }
.drop-zone p { color:var(--muted); margin:0 0 15px; }
.import-session { display:grid; grid-template-columns:280px minmax(0,1fr); gap:14px; margin-top:16px; }
.sheet-list { border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:8px; }
.sheet-item { width:100%; border:0; background:transparent; color:var(--text); border-radius:9px; padding:10px; text-align:left; cursor:pointer; }
.sheet-item.active { background:var(--primary-soft); color:var(--primary); font-weight:800; }
.mapping-grid { display:grid; grid-template-columns:1fr 80px 1fr; gap:8px; align-items:stretch; }
.mapping-col { border:1px solid var(--line); border-radius:13px; padding:11px; background:var(--surface-2); min-height:260px; }
.mapping-field { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px; border:1px solid var(--line); border-radius:9px; background:var(--surface); margin-bottom:7px; cursor:grab; font-size:11px; }
.mapping-field small { color:var(--muted); }
.mapping-arrows { display:grid; place-items:center; color:var(--muted); font-size:24px; }
.mapping-target { padding:9px; border:1px dashed var(--line); border-radius:9px; margin-bottom:7px; font-size:11px; min-height:39px; }
.mapping-target.mapped { border-style:solid; background:var(--primary-soft); }
/* Smart Workbook Import v1.3.7 */
.panel.import-session { display:block; }
.workbook-intelligence { display:grid; grid-template-columns:minmax(250px,330px) minmax(0,1fr); gap:14px; margin-top:16px; }
.workbook-source-list { border:1px solid var(--line); border-radius:15px; background:var(--surface-2); padding:9px; max-height:720px; overflow:auto; }
.workbook-source-card { width:100%; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text); padding:11px; margin-bottom:8px; text-align:left; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:9px; }
.workbook-source-card.active { border-color:var(--primary); box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 18%,transparent); background:var(--primary-soft); }
.workbook-source-card.excluded { opacity:.62; }
.workbook-source-title { font-weight:900; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.workbook-source-meta { display:block; color:var(--muted); font-size:10px; margin-top:4px; line-height:1.45; }
.workbook-source-toggle { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:800; white-space:nowrap; }
.workbook-source-toggle input { width:16px; height:16px; accent-color:var(--primary); }
.workbook-mapper { min-width:0; }
.smart-controls { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:12px; }
.smart-controls .field select { min-width:0; }
.smart-mapping-table select { width:100%; min-width:180px; min-height:35px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text); padding:5px 8px; }
.smart-mapping-table td:nth-child(1) { min-width:180px; white-space:normal; }
.smart-mapping-table td:nth-child(2) { min-width:160px; max-width:280px; overflow:hidden; text-overflow:ellipsis; }
.source-score { display:inline-flex; border-radius:999px; padding:3px 7px; font-size:9px; font-weight:900; background:var(--surface-2); border:1px solid var(--line); }
.source-score.good { color:var(--green); background:var(--green-soft); }
.source-score.watch { color:var(--amber); background:var(--amber-soft); }
.source-score.low { color:var(--coral); background:var(--coral-soft); }
.intelligence-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; margin:12px 0; }
.intelligence-chip { border:1px solid var(--line); border-radius:11px; background:var(--surface-2); padding:10px; }
.intelligence-chip strong,.intelligence-chip span { display:block; }
.intelligence-chip strong { font-size:16px; }
.intelligence-chip span { color:var(--muted); font-size:9px; margin-top:2px; }
@media (max-width:1050px){ .workbook-intelligence{grid-template-columns:1fr;} .workbook-source-list{max-height:330px;} .workbook-intelligence,.workbook-source-list,.workbook-mapper{min-width:0;width:100%;} }
@media (max-width:760px){ .main-content{overflow-x:hidden;} .panel-grid.equal{grid-template-columns:1fr;} .smart-controls{grid-template-columns:1fr;} .intelligence-summary{grid-template-columns:1fr 1fr;} .workbook-source-card{grid-template-columns:minmax(0,1fr);min-width:0;} .workbook-source-toggle{justify-content:flex-start;} .smart-mapping-table select{min-width:150px;} .header-field,.header-field.grow{min-width:0;width:100%;flex:1 1 100%;} }
@media (max-width:460px){ .intelligence-summary{grid-template-columns:1fr 1fr;} }
.confidence { font-size:9px; font-weight:900; color:var(--green); }
.preview-table { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:12px; margin-top:13px; }
.progress { height:8px; background:var(--line); border-radius:20px; overflow:hidden; }
.progress span { display:block; height:100%; background:linear-gradient(90deg,var(--primary),var(--blue)); transition:width .25s ease; }

.advisory-list { display:flex; flex-direction:column; gap:11px; }
.advisory-card { display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:start; padding:15px; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
.advisory-icon { width:42px; height:42px; border-radius:13px; display:grid; place-items:center; background:var(--purple-soft); color:var(--purple); font-size:19px; }
.advisory-card h3 { margin:0 0 4px; font-size:14px; }
.advisory-card p { margin:0; color:var(--muted); font-size:11px; line-height:1.55; }
.advisory-evidence { display:flex; gap:7px; flex-wrap:wrap; margin-top:9px; }
.evidence-pill { background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:5px 7px; font-size:9px; }

.stat-list { display:flex; flex-direction:column; gap:10px; }
.stat-row { display:grid; grid-template-columns:minmax(100px,1fr) 2fr auto; gap:10px; align-items:center; }
.stat-track { height:8px; border-radius:999px; background:var(--line); overflow:hidden; }
.stat-track span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--primary),var(--blue)); }

/* QA fix (P3, responsive): a non-wrapping inline-flex group. On Reports the four
   export buttons ran 3.6px past the clipped .main-content edge at 320px, shaving
   the last button. Wrapping costs nothing at desktop widths, where it never
   triggers, and keeps every button fully reachable on a narrow phone. */
.segmented { display:inline-flex; flex-wrap:wrap; max-width:100%; border:1px solid var(--line); border-radius:10px; padding:3px; background:var(--surface-2); }
.segmented button { border:0; background:transparent; color:var(--muted); padding:7px 10px; border-radius:7px; cursor:pointer; font-size:11px; font-weight:800; }
.segmented button.active { background:var(--surface); color:var(--primary); box-shadow:0 3px 8px rgba(30,50,70,.08); }
.notice { border:1px solid var(--line); border-left:4px solid var(--blue); background:var(--blue-soft); border-radius:12px; padding:12px 13px; color:var(--text); font-size:11px; line-height:1.5; }
.notice.warning { border-left-color:var(--amber); background:var(--amber-soft); }
.notice.danger { border-left-color:var(--coral); background:var(--coral-soft); }
.code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px; overflow:auto; }

@media (max-width: 1250px) {
  .metric-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .panel-grid { grid-template-columns:1fr; }
  .global-search { min-width:220px; }
}
@media (max-width: 880px) {
  .mobile-only { display:grid !important; }
  .app-shell { grid-template-columns:1fr; }
  .sidebar { position:fixed; inset:0 auto 0 0; width:min(var(--sidebar-width), 86vw); transform:translateX(-105%); transition:transform .2s ease; }
  .sidebar.open { transform:translateX(0); }
  /* QA10 fix (M1, blocker): the sidebar carries z-index:10 and the topbar only 5, so an open
     drawer covered the ☰ button that dismisses it. With no scrim, no Esc handler and no
     outside-tap dismiss, the only way out was to pick a nav destination — on a 375px phone the
     drawer hides 71% of the screen, so opening the menu and changing your mind was a trap.
     Lifting the topbar above the drawer keeps the toggle hittable; .nav-scrim (below) adds
     tap-to-close, and the keydown handler adds Esc. */
  .topbar { padding:0 12px; gap:8px; z-index:30; }
  #sidebarToggle { position:relative; z-index:31; }
  .breadcrumbs { display:none; }
  .global-search { min-width:0; }
  .top-actions .button.secondary { display:none; }
  .main-content { padding:16px; }
  .metric-grid { grid-template-columns:1fr; }
  .form-grid, .form-grid.three { grid-template-columns:1fr; }
  .field.full { grid-column:auto; }
  .page-header { flex-direction:column; }
  .header-actions { justify-content:flex-start; }
  .import-session { grid-template-columns:1fr; }
  .mapping-grid { grid-template-columns:1fr; }
  .mapping-arrows { transform:rotate(90deg); }
  .donut-wrap { grid-template-columns:1fr; justify-items:center; }

  /* QA10 fix (M5): touch targets. WCAG 2.2 AA requires 24x24 CSS px; the platform guidance is
     44x44 (iOS) / 48x48 (Android). The product row checkboxes measured 13x13 — 76 of them on the
     Products page — and the POS quantity and Remove controls measured 25-28px on the one screen
     that has to work under a thumb. Sizes are raised only at the touch breakpoint so the desktop
     table density is untouched. */
  input[type="checkbox"] { width:24px; height:24px; }
  .table-wrap input[type="checkbox"], .product-select { width:26px; height:26px; }
  /* .field.checkbox input is two classes deep, so it outranks the bare element selector above
     and kept Settings' toggles at 16px. Match its specificity rather than reaching for
     !important. */
  .field.checkbox input[type=checkbox] { width:24px; height:24px; }
  /* Inline text actions ("View all", "Why this quantity?") were 23px tall — one pixel under the
     WCAG 2.2 AA minimum. Widths were already fine; only the vertical hit area needed padding. */
  .link-button { min-height:26px; padding:4px 2px; }
  .pos-cart-line button, .pos-cart-line .link-button { min-width:40px; min-height:40px; padding:6px 10px; }
  .button.small { min-height:36px; }
  .icon-button { width:42px; height:42px; }

  /* QA10 fix (M6): with 10-column tables at 1184px inside a ~341px window, horizontal scrolling
     lost the reader's place — you could not tell which product a cell belonged to. Pinning the
     identity column keeps the row addressable while the rest scrolls under it. */
  .table-wrap td:first-child, .table-wrap th:first-child {
    position:sticky; left:0; z-index:1; background:var(--surface);
    box-shadow:1px 0 0 var(--line);
  }
  .table-wrap th:first-child { z-index:3; background:var(--surface-2); }
  .table-wrap tbody tr:hover td:first-child { background:color-mix(in srgb,var(--primary-soft) 45%,var(--surface)); }
}

/* QA10 fix (M1, blocker): tap-to-close scrim for the mobile drawer. Hidden entirely above the
   drawer breakpoint so it can never intercept desktop clicks. */
.nav-scrim { display:none; }
@media (max-width: 880px) {
  .nav-scrim { position:fixed; inset:0; z-index:9; background:rgba(8,20,33,.5); border:0; padding:0; }
  .nav-scrim[hidden] { display:none; }
  .nav-scrim:not([hidden]) { display:block; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
}
body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }


/* Single-file colorful visual enhancement layer */
:root {
  --rainbow-a: #11b9ae;
  --rainbow-b: #3977f6;
  --rainbow-c: #8b5cf6;
  --rainbow-d: #f27a63;
  --rainbow-e: #f2b746;
}
[data-theme="bright"] {
  --bg: #eef4ff;
  --surface: #ffffff;
  --surface-2: #f6f8ff;
  --nav: #10284a;
  --nav-2: #173968;
  --primary: #078f92;
  --primary-strong: #006d73;
  --primary-soft: #dffaf5;
  --blue: #356fe4;
  --blue-soft: #e6eeff;
  --amber: #b96f00;
  --amber-soft: #fff0c7;
  --coral: #cb4f5b;
  --coral-soft: #ffe1e4;
  --green: #16805d;
  --green-soft: #dcf7eb;
  --purple: #7850c8;
  --purple-soft: #eee6ff;
}
body {
  background:
    radial-gradient(circle at 9% 12%, color-mix(in srgb, var(--primary-soft) 78%, transparent) 0 10%, transparent 27%),
    radial-gradient(circle at 93% 7%, color-mix(in srgb, var(--purple-soft) 72%, transparent) 0 9%, transparent 25%),
    radial-gradient(circle at 82% 94%, color-mix(in srgb, var(--amber-soft) 62%, transparent) 0 9%, transparent 28%),
    var(--bg);
}
.sidebar {
  background:
    radial-gradient(circle at 10% 8%, rgba(38, 216, 200, .23), transparent 24%),
    radial-gradient(circle at 90% 54%, rgba(104, 94, 255, .20), transparent 30%),
    linear-gradient(165deg, var(--nav), color-mix(in srgb, var(--nav-2) 78%, #07111e));
}
.sidebar::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 5px;
  background: linear-gradient(90deg, var(--rainbow-a), var(--rainbow-b), var(--rainbow-c), var(--rainbow-d), var(--rainbow-e));
}
.sidebar { position: relative; }
/* QA fix: this enhancement-layer rule comes later in source order than the 880px
   media query, so it overrode the mobile drawer's position:fixed and pushed the
   whole workspace below the viewport on narrow screens. */
@media (max-width: 880px) { .sidebar { position: fixed; } }
/* QA fix: notice variants used by the Import Center but previously undefined. */
.notice.error { border-left-color: var(--coral); background: var(--coral-soft); }
.notice.success { border-left-color: var(--green); background: var(--green-soft); }
.brand-mark {
  background: conic-gradient(from 205deg, #17c8b9, #3481f5, #945ee8, #f16f67, #17c8b9);
  border: 1px solid rgba(255,255,255,.28);
}
.nav-item:nth-child(5n+1) .nav-icon { color: #64e0d2; }
.nav-item:nth-child(5n+2) .nav-icon { color: #82aeff; }
.nav-item:nth-child(5n+3) .nav-icon { color: #c4a2ff; }
.nav-item:nth-child(5n+4) .nav-icon { color: #ff9d8b; }
.nav-item:nth-child(5n) .nav-icon { color: #ffd073; }
.topbar {
  border-top: 4px solid transparent;
  border-image: linear-gradient(90deg, var(--rainbow-a), var(--rainbow-b), var(--rainbow-c), var(--rainbow-d), var(--rainbow-e)) 1;
  box-shadow: 0 8px 28px rgba(27, 63, 105, .07);
}
.main-content::before {
  content: "";
  position: fixed;
  pointer-events: none;
  right: 4vw;
  bottom: 2vh;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: conic-gradient(from 80deg, color-mix(in srgb,var(--primary) 18%,transparent), color-mix(in srgb,var(--purple) 15%,transparent), color-mix(in srgb,var(--amber) 13%,transparent), transparent 70%);
  filter: blur(36px);

.page-header {
  position: relative;

  background:
    linear-gradient(120deg, color-mix(in srgb, var(--primary-soft) 72%, var(--surface)), color-mix(in srgb, var(--blue-soft) 58%, var(--surface)) 47%, color-mix(in srgb, var(--purple-soft) 52%, var(--surface)));

.panel {

  border-color: color-mix(in srgb, var(--blue) 10%, var(--line));

.table-wrap thead th,

.button.primary {

.advisory-card:nth-child(4n) .advisory-icon { background: var(--blue-soft); color: var(--blue); }
.toast {

}
[data-theme="dark"] .page-header,
[data-theme="dark"] .panel,

/* QA fix: print stylesheet. Without it, body{overflow:hidden} plus the inner scroll
   container clipped "Print / save PDF" output to roughly one viewport. */
@media print {
  html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
  .app-shell { display: block; height: auto; }
  .workspace { display: block; height: auto; }
  .sidebar, .topbar, .toast-region, .header-actions, .table-toolbar, .row-actions, .modal-footer, #modalClose, .screen-only { display: none !important; }
  .main-content { overflow: visible !important; padding: 0; }
  .main-content::before { display: none; }
  .table-wrap { overflow: visible !important; max-height: none !important; }
  th { position: static; }
  .panel, .metric-card, .page-header, .modal { box-shadow: none !important; }
  .modal-backdrop { position: static !important; display: block !important; background: none !important; backdrop-filter: none !important; padding: 0 !important; }
  .modal-backdrop.hidden { display: none !important; }
  .modal { width: auto; max-height: none; border: 0; border-radius: 0; }
  .modal-body { overflow: visible; }
  /* When a report modal is open, print only the modal, not the app behind it. */
  body:has(.modal-backdrop:not(.hidden)) .app-shell { display: none !important; }
}


/* POS v1.4.5 — admin-only mutation hardening, revenue visibility, per-location stock ledger, partial multi-line transfers with printable delivery
   receipts, PIN sign-in with Admin/Manager/Cashier/Viewer roles, smart multi-tab workbook import,
   customer-controlled mapping, templates, duplicate safeguards, and offline POS. Once access control is enabled,
   only Admin may persist operational or administrative changes; all other roles are read-only. */
.pos-layout { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(360px,.82fr); gap:16px; align-items:start; }
.pos-catalog, .pos-cart-panel { min-width:0; }
.pos-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:14px; border-bottom:1px solid var(--line); background:var(--surface-2); }
.pos-toolbar .global-search { margin:0; max-width:none; min-width:260px; }
.pos-toolbar select { min-height:42px; border:1px solid var(--line); border-radius:11px; background:var(--surface); color:var(--text); padding:0 10px; }
.pos-product-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; padding:14px; max-height:max(300px, calc(100dvh - 320px)); overflow:auto; }
/* QA10 fix (D1): undo the table-scoped identity-column min-width inside the POS card and let long
   product names and barcodes ellipsise instead of overflowing the card by 45px. */
.pos-product-card .product-cell { min-width:0; }
.pos-product-card .product-cell > span { min-width:0; }
.pos-product-card h3, .pos-product-card .cell-sub { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pos-product-card { border:1px solid var(--line); border-radius:15px; background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--primary-soft) 28%,var(--surface))); padding:13px; text-align:left; cursor:pointer; min-height:128px; display:flex; flex-direction:column; gap:7px; transition:.16s ease; }
.pos-product-card:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--primary) 38%,var(--line)); box-shadow:0 10px 24px rgba(30,55,80,.10); }
.pos-product-card:disabled { opacity:.48; cursor:not-allowed; transform:none; box-shadow:none; }
.pos-product-card h3 { margin:0; font-size:13px; line-height:1.25; }
.pos-product-card .price { margin-top:auto; font-size:17px; font-weight:900; color:var(--primary); }
.pos-stock { display:flex; justify-content:space-between; gap:7px; color:var(--muted); font-size:10px; }
.pos-cart-panel { position:sticky; top:0; overflow:hidden; }
.pos-cart-lines { max-height:max(180px, calc(100dvh - 505px)); overflow:auto; }
.pos-cart-line { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
.pos-cart-line h3 { margin:0 0 3px; font-size:12px; }
.pos-cart-line p { margin:0; color:var(--muted); font-size:10px; }
.pos-qty { display:flex; align-items:center; gap:6px; margin-top:8px; }
.pos-qty button { width:28px; height:28px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--text); cursor:pointer; font-weight:900; }
.pos-qty strong { min-width:26px; text-align:center; }
.pos-line-money { text-align:right; font-weight:900; white-space:nowrap; }
.pos-discount { margin-top:7px; width:112px; height:30px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text); padding:0 8px; font-size:11px; }
.pos-summary { padding:14px; background:var(--surface-2); border-top:1px solid var(--line); }
.pos-summary-row { display:flex; justify-content:space-between; gap:12px; margin:7px 0; font-size:12px; }
.pos-summary-row.total { font-size:20px; font-weight:950; padding-top:10px; border-top:1px dashed var(--line); }
.pos-summary .field { margin:10px 0; }
.pos-session-banner { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; padding:11px 14px; border-bottom:1px solid var(--line); background:linear-gradient(90deg,var(--green-soft),var(--blue-soft)); }
.pos-session-banner strong { font-size:12px; }
.pos-session-banner span { color:var(--muted); font-size:10px; }
.receipt-print { width:min(380px,100%); margin:0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--text); }
.receipt-print .receipt-center { text-align:center; }
.receipt-print h2 { margin:0 0 4px; font-size:20px; }
.receipt-print p { margin:3px 0; font-size:11px; }
.receipt-rule { border:0; border-top:1px dashed currentColor; margin:12px 0; opacity:.45; }
.receipt-line { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; margin:8px 0; font-size:11px; }
.receipt-line small { display:block; opacity:.72; margin-top:2px; }
.receipt-total { display:flex; justify-content:space-between; gap:12px; margin:5px 0; font-size:11px; }
.receipt-total.grand { font-size:15px; font-weight:900; margin-top:9px; }
@media (max-width:1250px){ .pos-product-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
/* QA10 fix (M2, blocker): this breakpoint stacked the two POS columns and, in the same rule,
   removed BOTH things that kept the transaction reachable — the sticky cart and the product
   grid's height cap. With the 75-product sample that put the Charge button at y≈5217 in an
   812px viewport: ~3500px of scrolling down to confirm each scan and back up to scan the next.
   The cart panel now sticks to the bottom of the viewport instead of the top, and the grid keeps
   a cap so the catalogue can never bury it. */
/* Base state first: above the stacking breakpoint the desktop cart panel is always on screen, so
   the pinned bar is noise. This declaration must precede the media query below — an equal-
   specificity rule placed after it would win the cascade and silently hide the bar everywhere. */
.pos-mobile-bar{display:none;}
@media (max-width:1020px){
  .pos-layout{grid-template-columns:1fr;}
  .pos-product-grid{max-height:min(52dvh, 560px);}
  .pos-cart-lines{max-height:34dvh;}
  /* A sticky-bottom cart cannot help here: the cart is the LAST element in the stacked order, so
     it is already at the bottom by the time it scrolls into view. A pinned summary bar is the
     pattern that actually works — the running total and Charge stay one tap away no matter how
     far down the catalogue the cashier has scrolled. */
  .pos-mobile-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:8;
    display:flex; align-items:center; gap:12px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); box-shadow:0 -8px 24px rgba(20,40,60,.14);
  }
  .pos-mobile-bar-total{display:flex; flex-direction:column; line-height:1.2; min-width:0;}
  .pos-mobile-bar-total span{font-size:11px; color:var(--muted);}
  .pos-mobile-bar-total strong{font-size:19px; letter-spacing:-.03em;}
  .pos-mobile-bar .button{margin-left:auto; min-height:46px; padding:8px 22px;}
  /* Keep the pinned bar from covering the last row of whatever is scrolled beneath it. */
  .main-content:has(.pos-mobile-bar){padding-bottom:96px;}
}
@media (max-width:620px){ .pos-product-grid{grid-template-columns:1fr;} }
@media print {
  .receipt-print { color:#000 !important; width:78mm; max-width:78mm; }
  .receipt-print * { color:#000 !important; background:transparent !important; box-shadow:none !important; }
}

/* v1.4 — transfers, delivery receipts, users and roles */
.user-badge { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; padding:9px 10px; border-radius:11px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13); }
.user-badge strong { display:block; font-size:12px; color:#fff; }
.user-badge small { display:block; font-size:10px; opacity:.66; }
.user-badge .button { min-height:28px; padding:3px 9px; font-size:11px; }
input.invalid, select.invalid { border-color:var(--coral) !important; background:var(--coral-soft); }

.lock-screen { position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:24px; background:linear-gradient(165deg,var(--nav),color-mix(in srgb,var(--nav) 70%,#000)); overflow:auto; }
.lock-screen.hidden { display:none !important; }
.lock-card { width:min(400px,100%); background:var(--surface); color:var(--text); border-radius:var(--radius); padding:30px 26px; box-shadow:0 26px 60px rgba(0,0,0,.34); text-align:center; }
.lock-card h1 { margin:0 0 6px; font-size:21px; letter-spacing:-.03em; }
.lock-card > p { margin:0 0 18px; color:var(--muted); font-size:13px; }
.lock-card .field { text-align:left; }
.lock-card .button { margin-top:8px; }
.lock-note { margin:16px 0 0; font-size:11px; color:var(--muted); line-height:1.5; }

.delivery-note { width:min(760px,100%); margin:0 auto; color:var(--text); font-size:12px; }
.dn-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding-bottom:14px; border-bottom:2px solid var(--text); }
.dn-head h2 { margin:0 0 3px; font-size:19px; letter-spacing:-.02em; }
.dn-head p { margin:2px 0; font-size:11px; color:var(--muted); }
.dn-kind { text-transform:uppercase; letter-spacing:.12em; font-weight:850; font-size:10px !important; color:var(--primary) !important; margin-top:7px !important; }
.dn-number { text-align:right; white-space:nowrap; }
.dn-number strong { font-size:18px; letter-spacing:-.02em; }
.dn-status { font-weight:800; color:var(--text) !important; }
.dn-parties { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:16px 0; }
.dn-parties h3 { margin:0 0 5px; font-size:9px; text-transform:uppercase; letter-spacing:.13em; color:var(--muted); }
.dn-parties strong { font-size:13px; }
.dn-parties p { margin:2px 0 0; font-size:11px; color:var(--muted); }
.dn-table { width:100%; border-collapse:collapse; margin-top:6px; }
.dn-table th, .dn-table td { border:1px solid var(--line); padding:7px 9px; text-align:left; }
/* The app's `table thead th` paints a dark navy gradient with near-white text, which is right on
   screen and wrong on a printed document. A delivery note overrides both so its headers stay
   legible in the dialog and survive a black-and-white printer. */
.dn-table thead th { background:var(--surface-2); background-image:none; color:var(--text); border-bottom-color:var(--line); position:static; font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
.dn-table .num { text-align:right; white-space:nowrap; }
.dn-table tfoot td { font-weight:850; background:var(--surface-2); }
.dn-notes { margin:12px 0 0; font-size:11px; line-height:1.5; }
.dn-signoff { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin:28px 0 0; }
.dn-signoff div { display:flex; flex-direction:column; }
.dn-signoff span { font-size:9px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
.dn-signoff em { font-style:normal; font-size:11px; min-height:17px; margin-top:16px; }
.dn-signoff i { display:block; border-top:1px solid var(--text); margin-top:3px; padding-top:3px; content:""; }
.dn-foot { margin:22px 0 0; text-align:center; font-size:11px; }
.dn-small { color:var(--muted); font-size:10px; margin-top:5px; }
@media (max-width:760px){ .dn-parties, .dn-signoff { grid-template-columns:repeat(2,minmax(0,1fr)); } .dn-head { flex-direction:column; } .dn-number { text-align:left; } }
@media print {
  /* A delivery receipt is an A4 document, not a till slip: print it full width in black. */
  .delivery-note { width:100%; max-width:100%; color:#000 !important; font-size:11px; }
  .delivery-note *, .dn-parties p, .dn-parties h3, .dn-head p { color:#000 !important; }
  .dn-table thead th, .dn-table tfoot td { background:#f1f1f1 !important; background-image:none !important; color:#000 !important; }
  .dn-table { page-break-inside:auto; }
  .dn-table tr { page-break-inside:avoid; }
  .dn-signoff { page-break-inside:avoid; }
  .lock-screen { display:none !important; }
}

    const v = cell.value;
    if (v == null || v === '') return `<c r="${ref}"${styleAttr}/>`;
    if (typeof v === 'number' && Number.isFinite(v)) return `<c r="${ref}"${styleAttr}><v>${v}</v></c>`;
    if (typeof v === 'boolean') return `<c r="${ref}" t="b"${styleAttr}><v>${v ? 1 : 0}</v></c>`;
    if (v instanceof Date) {
      return `<c r="${ref}" t="inlineStr"${styleAttr}><is><t>${xmlEscape(v.toISOString().slice(0, 10))}</t></is></c>`;
    }
    return `<c r="${ref}" t="inlineStr"${styleAttr}><is><t xml:space="preserve">${xmlEscape(v)}</t></is></c>`;
  }

  function sheetXml(sheet, workbook, sheetIndex) {
    const rows = sheet.rows || [];
    const maxCols = Math.max(1, ...rows.map(r => r.length));
    const maxRows = Math.max(1, rows.length);
    const dim = `A1:${colName(maxCols)}${maxRows}`;
    const cols = (sheet.columns || []).map((c, i) => {
      const width = Math.min(60, Math.max(8, Number(c.width || c || 14)));
      return `<col min="${i + 1}" max="${i + 1}" width="${width}" customWidth="1"/>`;
    }).join('');
    const customHeights = sheet.rowHeights || {};
    const rowXml = rows.map((row, r) => {
      const cells = row.map((cell, c) => cellXml(cell, r, c, sheet)).join('');
      const configured = Number(customHeights[r + 1] || 0);
      const fallback = r === 0 ? (sheet.name === 'Executive Dashboard' ? 38 : 30) : 20;
      const height = configured || fallback;
      return `<row r="${r + 1}" ht="${height}" customHeight="1">${cells}</row>`;
    }).join('');
    const frozenRows = Math.max(0, Number(sheet.frozenRows || 0));
    const frozenCols = Math.max(0, Number(sheet.frozenCols || 0));
    const zoom = Math.min(130, Math.max(60, Number(sheet.zoom || (sheet.name === 'Executive Dashboard' ? 85 : 90))));
    let pane = '';
    const selected = sheetIndex === 0 ? ' tabSelected="1"' : '';
    if (frozenRows || frozenCols) {
      const topLeft = `${colName(frozenCols + 1)}${frozenRows + 1}`;
      // SpreadsheetML has four pane names. A rows-only freeze creates a
      // bottomLeft pane; a columns-only freeze creates topRight; both create
      // bottomRight. Referring to a pane that does not exist makes desktop
      // Excel repair the workbook during open.
      const activePane = frozenRows && frozenCols ? 'bottomRight' : frozenRows ? 'bottomLeft' : 'topRight';
      pane = `<sheetViews><sheetView workbookViewId="0" showGridLines="0" zoomScale="${zoom}"${selected}><pane${frozenCols ? ` xSplit="${frozenCols}"` : ''}${frozenRows ? ` ySplit="${frozenRows}"` : ''} topLeftCell="${topLeft}" activePane="${activePane}" state="frozen"/><selection pane="${activePane}" activeCell="${topLeft}" sqref="${topLeft}"/></sheetView></sheetViews>`;
    } else {
      pane = `<sheetViews><sheetView workbookViewId="0" showGridLines="0" zoomScale="${zoom}"${selected}/></sheetViews>`;
    }
    const merges = (sheet.merges || []).length
      ? `<mergeCells count="${sheet.merges.length}">${sheet.merges.map(m => `<mergeCell ref="${xmlEscape(m)}"/>`).join('')}</mergeCells>`
      : '';
    const filterRef = sheet.autoFilterRange || `A1:${colName(maxCols)}${maxRows}`;
    const filter = sheet.autoFilter === false || !rows.length ? '' : `<autoFilter ref="${xmlEscape(filterRef)}"/>`;
    const tabColor = String(sheet.tabColor || '17324D').replace(/^#|^FF/i, '').toUpperCase();
    const sheetPr = `<sheetPr><tabColor rgb="FF${tabColor}"/><pageSetUpPr fitToPage="1"/></sheetPr>`;
    const safeTitle = xmlEscape(sheet.name || workbook.title || 'Inventory Command Center');
    const headerFooter = `<headerFooter><oddHeader>&amp;L&amp;B${safeTitle}&amp;R${xmlEscape(workbook.title || '')}</oddHeader><oddFooter>&amp;LGenerated by Inventory Command Center&amp;CPage &amp;P of &amp;N&amp;R${new Date().toISOString().slice(0,10)}</oddFooter></headerFooter>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
${sheetPr}<dimension ref="${dim}"/>${pane}<sheetFormatPr defaultRowHeight="20"/>${cols ? `<cols>${cols}</cols>` : ''}<sheetData>${rowXml}</sheetData>${merges}${filter}<printOptions horizontalCentered="0" verticalCentered="0" headings="0" gridLines="0"/><pageMargins left="0.3" right="0.3" top="0.55" bottom="0.55" header="0.25" footer="0.25"/><pageSetup paperSize="9" orientation="${sheet.orientation || 'landscape'}" fitToWidth="1" fitToHeight="0"/>${headerFooter}</worksheet>`;
  }

  async function build(workbook, options = {}) {

  function parseXml(text) {
    if (typeof DOMParser !== 'undefined') return new DOMParser().parseFromString(text, 'application/xml');

/* v1.4 per-location stock ledger.
   `stock` holds one row per (product, location): {id, productId, locationId, qty}. The ledger is
   the source of truth for where units physically sit; `product.quantity` is a maintained cache of
   the row sum so that every pre-existing quantity reader — dashboard totals, valuation, reorder
   maths, reports, and the workbook export — keeps working untouched.

   stay counted in the product total while belonging to neither warehouse. */

   of the FNV mix lands around 3-6ms on a modern phone — unnoticeable to a cashier at the till,
   but it turns an instant sweep of all 10,000 four-digit PINs into a minute-scale grind. */

const PIN_MAX_ATTEMPTS = 5;
const PIN_LOCK_BASE_MS = 5000;
const PIN_LOCK_MAX_MS = 60000;

   only to files this app itself creates, never to the rest of the user's Drive. */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
const DRIVE_DEFAULT_FILE = 'inventory-command-center-workspace.json';
const DRIVE_DEVICE_KEY = 'icc-device-id';

   is enabled, every non-admin role is read-only: they may view assigned operational screens
   and reports, but receive no capability that can persist workspace data, administer users,
   run POS checkout/returns, import, sync, back up, or reset the workspace. */
const ROLE_CAPABILITIES = {
 Admin:['*'],

 Cashier:['reports'],

};

   Write-oriented modules (POS, Reorder, Purchasing, Suppliers, Tax Profiles, Import, Advisory,
   Backup, Users, Settings) are Admin-only so no misleading mutation controls are exposed. */

function seedStockLedger(state){
 const known=new Set((state.products||[]).map(p=>p.id));
 const rows=(state.stock||[]).filter(r=>r&&known.has(r.productId));
 const byProduct=new Map();
 for(const r of rows){
  r.id=r.id||uid('stk');
  r.locationId=String(r.locationId??'');
  r.qty=Number(r.qty)||0;
  const list=byProduct.get(r.productId);
  if(list)list.push(r);else byProduct.set(r.productId,[r]);
 }
 for(const p of state.products||[]){
  let list=byProduct.get(p.id);
  if(!list||!list.length){
   const seeded={id:uid('stk'),productId:p.id,locationId:String(p.locationId||''),qty:Number(p.quantity)||0};
   byProduct.set(p.id,[seeded]);rows.push(seeded);list=[seeded];
  }
  p.quantity=list.reduce((a,r)=>a+r.qty,0);
 }
 state.stock=rows;
 return state;
}
